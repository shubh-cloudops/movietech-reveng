name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python packages
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test (no API keys needed; Gemini is faked)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t movietech:ci .
      - name: Smoke test (starts, has ffmpeg, runs as a normal user)
        run: |
          docker run --rm movietech:ci --help
          docker run --rm --entrypoint ffmpeg movietech:ci -version
          test "$(docker run --rm --entrypoint id movietech:ci -u)" = "1000"
          docker run --rm --entrypoint touch movietech:ci /data/write-check

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate (no GCP credentials needed)
        run: |
          terraform init -backend=false
          terraform validate
